name: BofAMobile
options:
  bundleIdPrefix: com.bofa
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
configs:
  Debug: debug
  Mock: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "4.12.0"
    CURRENT_PROJECT_VERSION: "1187"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  SnapKit:
    url: https://github.com/SnapKit/SnapKit
    exactVersion: 5.0.1
  BoAFoundation:
    path: Packages/BoAFoundation
targets:
  BofAMobile:
    type: application
    platform: iOS
    sources:
      - path: BofAMobile
        excludes:
          - "Config/Info.plist"
    dependencies:
      - package: SnapKit
      - package: BoAFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bofa.mobile
        PRODUCT_NAME: BofAMobile
        INFOPLIST_FILE: BofAMobile/Config/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        BOA_DISPLAY_NAME: BofA
      configs:
        Mock:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG MOCK_API
          PRODUCT_BUNDLE_IDENTIFIER: com.bofa.mobile.mock
          BOA_DISPLAY_NAME: BofA
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.bofa.mobile.dev
          BOA_DISPLAY_NAME: BofA Dev
  BofAMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BofAMobileTests
    dependencies:
      - target: BofAMobile
      - package: BoAFoundation
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bofa.mobile.tests
schemes:
  BofAMobile:
    build:
      targets:
        BofAMobile: all
        BofAMobileTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - BofAMobileTests
    archive:
      config: Release
  BofAMobile-Mock:
    build:
      targets:
        BofAMobile: all
        BofAMobileTests: [test]
    run:
      config: Mock
    test:
      config: Mock
      gatherCoverageData: true
      targets:
        - BofAMobileTests
    archive:
      config: Mock
